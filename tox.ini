
# Tox reference:
# https://tox.wiki/en/stable/user_guide.html
# https://tox.wiki/en/stable/config.html

[tox]
requires =
    tox>=4
env_list = type, py{310}

[testenv]
description = run unit tests
deps =
    pytest>=7
    pytest-sugar
setenv =
    PYTHONPATH=src
commands =
    pytest --tb=short {posargs}
    # https://docs.pytest.org/en/7.1.x/how-to/output.html

[testenv:type]
description = run type checks
deps =
    pytest>=7
    mypy>=1.5
    types-requests~=2.31
setenv =
    PYTHONPATH=src
commands =
    mypy --strict {posargs:src tests}
    # TEMP
    python -m nextpyp.client.jsonrpc
