
# Tox reference:
# https://tox.wiki/en/stable/user_guide.html
# https://tox.wiki/en/stable/config.html

[tox]
requires =
    tox>=4
env_list = type, py{310}

[testenv]
description = run unit tests
deps =
    pytest>=7
    pytest-sugar
setenv =
    PYTHONPATH=src
commands =
    pytest {posargs}

[testenv:type]
description = run type checks
deps =
    mypy>=1.5
setenv =
    PYTHONPATH=src
commands =
    mypy --strict {posargs:src tests}
