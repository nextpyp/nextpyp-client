
# pyproject.toml reference:
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#writing-pyproject-toml

# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "nextpyp-client"
# matches the nextPYP API version this client speaks (gen.API_VERSION):
# client X.Y.* works with any nextPYP website whose API is X.Y or newer (same X).
# client-only fixes bump the patch number. tests/nextpyp/client/test_version.py checks this.
version = "2.2.0"
authors = [
    { name="Jeff Martin", email="jeff@cuchazinteractive.com" },
]
maintainers = [
    { name = "Alberto Bartesaghi", email = "alberto.bartesaghi@duke.edu" }
]
description = "Python client for the nextPYP cryo-EM/ET website: projects, sessions, and real-time updates."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["nextpyp", "cryo-em", "cryo-et", "api-client"]
# TODO: can this be relaxed to an earlier version?
#       how to test? I only have v3.10 installed locally
requires-python = ">=3.10"
classifiers = [
    # https://pypi.org/classifiers/
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed"
]
dependencies = [
    "requests~=2.31", # Apache 2
    # pinned: realtime.py uses websockets.legacy, which newer major versions deprecate
    "websockets~=12.0", # BSD 3-clause
    "semver~=3.0.2", # BSD 3-clause
    "toml~=0.10.2" # MIT
]

[project.urls]
Homepage = "https://nextpyp.app"
Documentation = "https://nextpyp.app/nextpyp-client"
Source = "https://gitlab.cs.duke.edu/nextpyp/nextpyp-client"
Mirror = "https://github.com/nextpyp/nextpyp-client"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# https://hatch.pypa.io/latest/config/build/
[tool.hatch.build.targets.wheel]
packages = ["src/nextpyp"]

# https://docs.pytest.org/en/7.4.x/reference/customize.html
[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "tests"
]
